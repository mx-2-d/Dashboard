<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleta</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {

        }

        @layer base {
            h1 {
                @apply text-2xl;
            }

            body {
                @apply w-4/5 m-auto bg-purple-100;
            }

            fieldset {
                @apply flex flex-row;
            }

            label {
                @apply flex-1 h-6;
            }

            input {
                @apply flex-2 h-6 mr-6 border-black border-2 bg-yellow-200;
            }

            img {
                @apply h-60 border-2
            }
            
            
        }

    </style>

</head>


<body>
    <br>
    <h1>Galletas</h1>
    <br>
    <br>
    <img id="img1" src="descarga.jpg" alt="">
    <br>
    <br>
    <input type="button" value="Abrir la galleta" onclick="abrir()">
    <input type="button" value="Volver a jugar" onclick="volver()">
    <input type="button" value="Repetir" onclick="repetir()">
    <br>
    <br>
    
    <p id="mensaje1"></p>

    <script>
        const MENSAJE1 = document.getElementById("mensaje1");
        const IMG1 = document.getElementById("img1");

        const mensajes = [
        "Si tú sabes lo que vales, ve y consigue lo que mereces.<br><em>Rocky Balboa</em>.",
        "Por muy alta que sea una montaña, siempre hay un camino hacia la cima.<br><em>Anónimo</em>.",
        "El triunfo verdadero del hombre surge de las cenizas del error.<br><em>Pablo Neruda</em>.",
        "Lo único imposible es aquello que no intentas.<br><em>Anónimo</em>.",
        "El 80% del éxito se basa simplemente en insistir.<br><em>Woody Allen</em>.",
        "Nunca pares, nunca te conformes, hasta que lo bueno sea mejor y lo mejor excelente.<br><em>Anónimo</em>.",
        "Cuanto más hacemos, más podemos hacer.<br><em>William Hazlitt</em>.",
        "Da siempre lo mejor que tienes. Lo que plantes ahora, lo cosecharás más tarde.<br><em>Og Mandino</em>.",
        "La tragedia no es no alcanzar tus objetivos, la tragedia es no tener objetivos que alcanzar.<br><em>Benjamin Mays</em>."
        ];

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function abrir() {
            let numMensajeRandom = parseInt(Math.random() * (mensajes.length-1));
            // console.log(numMensajeRandom);
            IMG1.src = "descarga1.jpg";
            MENSAJE1.innerHTML = mensajes[numMensajeRandom];
        }

        function volver() {
            IMG1.src = "descarga.jpg";
            MENSAJE1.innerHTML = "";
        }


        async function repetir() {
            for (let i = 0 ; i < 100 ; i++) {
               abrir();
               await delay(150);
               volver();
               await delay(150);
               console.log(i);
            }
        }

    </script>

</body>

</html>
