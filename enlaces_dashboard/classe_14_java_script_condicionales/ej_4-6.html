<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {

        }

        @layer base {
            h1 {
                @apply text-6xl text-yellow-200;
            }

            body {
                @apply w-2/3 m-auto bg-green-900;
            }

            fieldset {
                @apply border-4 border-yellow-200 p-2 flex flex-row;
            }

            label {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto mr-10;
            }

            input {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto;
            }

            input [type = "checkbox"] {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto h-1/2;
            }

            select {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto mr-18;
            }

            img {
                @apply h-60 border-2;
            }

            p {
                @apply text-xl text-yellow-200 font-bold;
            }
            
            
        }

    </style>

</head>


<body>
    <br>
    <br>
    <br>
    <br>
    <br>
    <h1>Restaurante</h1>
    <br>
    <br>
    <fieldset>
        <select name="comida" id="comida">
            <option value="carne">Carne</option>
            <option value="risotto">Risotto</option>
            <option value="pasta">Pasta</option>
        </select>

        <input type="checkbox" id="veg">
        <label for="veg">Vegano/a</label>
        <input type="checkbox" id="gluten">
        <label for="gluten">Intolerante a gluten</label>
        <input type="checkbox" id="lactosa">
        <label for="lactosa">Intolerante a lactosa</label>
    </fieldset>
    <br>
    <br>
    <input type="button" value="Evaluar" onclick="evaluar()">
    <br>
    <br>
    <p id="contenido"></p>

    <script>
        const CONTENIDO = document.getElementById("contenido");
        const COMIDA = document.getElementById("comida");
        const checkVEG = document.getElementById("veg");
        const checkGLUTEN = document.getElementById("gluten");
        const checkLACTOSA = document.getElementById("lactosa");

        function evaluar() {
            if (checkVEG.checked && COMIDA.value == "carne") CONTENIDO.innerHTML = "No puedes comer esto!"
            else if (checkGLUTEN.checked && COMIDA.value == "pasta") CONTENIDO.innerHTML = "No puedes comer esto!"
            else if (checkLACTOSA.checked && COMIDA.value == "risotto") CONTENIDO.innerHTML = "No puedes comer esto!"
            else CONTENIDO.innerHTML = "Todo bien!"
        }
        

    </script>

</body>

</html>
