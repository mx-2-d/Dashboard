<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontrar el primer número primo</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {
            --color-charcoal: #555555;
            --color-slime: #A7FC00;
            --color-pumpkin: #C04000;
            --color-azure: #0000B8;
            --color-neon: #E3FF00;
            --color-neon_p: #FF00CC;
            --color-moss: #568203;
            --color-honey: #E6A817;
            --color-ghost: #F8F8FF;
            --color-inferno: #A91101;
            --color-alabaster: #E5E4E2;
        }

        @layer base {
            h1 {
                @apply text-5xl text-black font-bold mt-5 mb-10;
            }

            li {
                @apply m-auto list-decimal text-2xl font-bold text-black;
            }

            body {
                @apply bg-azure;
            }

            label {
                @apply font-bold text-black bg-alabaster hover:bg-azure hover:text-alabaster p-1;
            }

            input {
                @apply font-bold border-black border-2 text-black bg-alabaster hover:bg-azure hover:text-alabaster p-1;
            }

            select {
                @apply border-black border-2 text-black bg-alabaster hover:bg-azure hover:text-alabaster;
            }

            img {
                @apply h-60;
            }

            p {
                @apply text-black font-bold text-lg;
            }
            
            
        }

    </style>

</head>


<body>

    <div class="bg-alabaster m-auto p-6 w-4/5 mt-5 shadow shadow-black border-2 border-black border-t-8 border-t-black min-h-90">

        <h1>Encontrar el primer número primo</h1>

        <div class="flex gap-4">
            <input class="flex-4" type="text" id="nums" placeholder="Introduce los números separados por commas">
            <input class="flex-1" type="button" value="Encontrar el primer número primo" onclick="primerPrimo()">
        </div>

        <p class="my-12 text-center text-2xl italic" id="contenido"></p>
    </div>

    <script>
        const CONTENIDO = document.getElementById("contenido");

        const NUMS = document.getElementById("nums");

        // returns 1 si n1 es primo y 0 si n1 no es primo
        function primo(n1) {
            let soluciones = [];
            let sol = 0;
            
            let i = 2;
            while (soluciones.length == 0) {
                if (n1 == 0 || n1 == 1 || n1 == 2) break;
                sol = n1 / i;
                if (Number.isInteger(sol)) soluciones.push(sol);
                console.log(i);
                i++;
                if (i == n1) break;
            }

            if (n1 == 0) return 0;
            else if (soluciones.length == 0) return 1;
            else if (n1 == 1 || n1 == 2) return 1;
            else if (soluciones.length >= 1) return 0;
        }

        function primerPrimo() {
            let nums = NUMS.value;
            nums = nums.replaceAll(" ", "");
            let arr = nums.split(",");

            let z = 0;
            while (primo(parseInt(arr[z])) !== 1) {
                primo(parseInt(arr[z]));
                z++;
            }

            CONTENIDO.innerHTML = `El número ${arr[z]} es el primer número primo de la lista`

        }

    </script>

    </body>

</html>

<!-- Mejor sería hacer esto con while y que pare la busqueda de divisores cuando ha encontrado uno que no es 1 o el número mismo. Así se puede hacer lo mismo en menos pasos -->
