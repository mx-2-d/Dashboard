<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número a letra</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {

        }

        @layer base {
            h1 {
                @apply text-6xl text-yellow-200;
            }

            body {
                @apply w-1/2 m-auto bg-green-900;
            }

            fieldset {
                @apply flex flex-row gap-6;
            }

            label {
                @apply border-2 bg-blue-400 text-yellow-200 hover:bg-yellow-200 hover:text-blue-400 flex-1 h-6;
            }

            input {
                @apply m-auto border-black border-2 text-blue-400 bg-yellow-200 hover:bg-blue-400 hover:text-yellow-200 flex-1 h-6;
            }

            img {
                @apply h-60 border-2;
            }

            p {
                @apply text-xl text-yellow-200 font-bold;
            }
            
            
        }

    </style>

</head>


<body>
    <br>
    <h1>Convertir número</h1>
    <br>
    <br>
    <br>
    <br>
    <fieldset>
        <label for="n">Introduce un número entre 0 y 10</label>
        <input type="number" id="n" name="n">
    </fieldset>
    <br>
    
    

    <input type="button" value="Convertir" onclick="convertir()">
    <br>
    <br>
    
    <p id="contenido"></p>

    <script>
        const N = document.getElementById("n");
        const CONTENIDO = document.getElementById("contenido");
        const n_letras = [
            "zero",
            "uno",
            "dos",
            "tres",
            "cuatro",
            "cinco",
            "seis",
            "siete",
            "ocho",
            "nueve",
            "diez"
        ]

        const convertir = () => {
            let n = parseInt(N.value);
            if (n >= 0 && n <= 10) CONTENIDO.innerHTML = n_letras[n];
            else CONTENIDO.innerHTML = "El número tiene que ser entre 0 y 10";
        }
        

    </script>

</body>

</html>
