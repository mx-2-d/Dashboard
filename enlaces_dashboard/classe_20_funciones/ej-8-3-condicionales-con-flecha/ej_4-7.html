<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisor</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {

        }

        @layer base {
            h1 {
                @apply text-6xl text-yellow-200;
            }

            body {
                @apply w-2/3 m-auto bg-green-900;
            }

            fieldset {
                @apply border-4 border-yellow-200 p-2 flex flex-row gap-4;
            }

            label {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto mr-10;
            }

            input {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto;
            }

            input [type = "checkbox"] {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto h-1/2;
            }

            select {
                @apply border-black border-2 text-blue-800 bg-yellow-200 hover:bg-blue-800 hover:text-yellow-200 flex-auto mr-18;
            }

            img {
                @apply h-60 border-2;
            }

            p {
                @apply text-xl text-yellow-200 font-bold;
            }
            
            
        }

    </style>

</head>


<body>
    <br>
    <br>
    <br>
    <br>
    <br>
    <h1>Divisor</h1>
    <br>
    <br>
    <fieldset>
        <input type="number" id="dividendo" placeholder="Dividendo">
        <input type="number" id="divisor" placeholder="Divisor">
    </fieldset>
    <br>
    <br>
    <input type="button" value="Evaluar" onclick="evaluar()">
    <br>
    <br>
    <p id="contenido"></p>

    <script>
        const DIVISOR = document.getElementById("divisor");
        const DIVIDENDO = document.getElementById("dividendo");
        const CONTENIDO = document.getElementById("contenido");

        // Hay que definir x dentro de la function. Si no define primero x antes que se han introducido los valores

        const evaluar = () => {
            let x = parseFloat(DIVIDENDO.value) / parseFloat(DIVISOR.value);

            if (parseFloat(DIVISOR.value) >= 2 && parseFloat(DIVISOR.value) <= 7 && Number.isInteger(x)) CONTENIDO.innerHTML = "El dividiendo es múltiplo del divisor";
            else if (parseFloat(DIVISOR.value) >= 2 && parseFloat(DIVISOR.value) <= 7 && !Number.isInteger(x)) CONTENIDO.innerHTML = "El dividiendo NO es múltiplo del divisor";
            else if (parseFloat(DIVISOR.value) < 2 || parseFloat(DIVISOR.value) > 7) alert("El divisor tiene que estar entre 2 y 7");
            else alert("Error");
        }

    </script>

</body>

</html>
