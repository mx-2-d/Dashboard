<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meses</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {
            --color-charcoal: #555555;
            --color-slime: #A7FC00;
            --color-pumpkin: #C04000;
        }

        @layer base {
            h1 {
                @apply text-6xl text-slime;
            }

            li {
                @apply m-auto list-decimal text-2xl font-bold text-slime;
            }

            body {
                @apply w-2/3 m-auto bg-charcoal;
            }

            fieldset {
                @apply border-4 border-pumpkin p-2 flex flex-row gap-4;
            }

            label {
                @apply font-bold border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-auto mr-10;
            }

            input {
                @apply font-bold border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-auto;
            }

            input [type = "checkbox"] {
                @apply border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-auto h-1/2;
            }

            select {
                @apply border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-auto mr-18;
            }

            img {
                @apply h-60 border-2;
            }

            p {
                @apply text-xl text-slime font-bold;
            }
            
            
        }

    </style>

</head>


<body>
    <br>
    <br>
    <br>
    <br>
    <br>
    <h1>Meses</h1>
    <br>
    <fieldset>
        <label for="mes">Escríbe el número de un mes</label>
        <input type="number" id="mes" placeholder="Número de mes">
    </fieldset>
    <br>
    <br>
    <input type="button" value="Evaluar" onclick="evaluar()">
    <br>
    <br>
    <p id="contenido"></p>

    <script>
        const MES = document.getElementById("mes");
        const CONTENIDO = document.getElementById("contenido");

        const meses = [
            "null",
            "Enero",
            "Febrero",
            "Marzo",
            "Abril",
            "Mayo",
            "Junio",
            "Julio",
            "Agosto",
            "Septiembre",
            "Octubre",
            "Noviembre",
            "Diciembre"
        ]

        function evaluar() {
            if (parseInt(MES.value) <= 12 && parseInt(MES.value) >= 1)
                CONTENIDO.innerHTML = `El mes ${parseInt(MES.value)} corresponde con ${meses[parseInt(MES.value)]}.`;
            else CONTENIDO.innerHTML = "Elige un número entre 1 y 12";
        }

    </script>

</body>

</html>
