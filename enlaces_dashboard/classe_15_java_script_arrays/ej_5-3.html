<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {
            --color-charcoal: #555555;
            --color-slime: #A7FC00;
            --color-pumpkin: #C04000;
        }

        @layer base {
            h1 {
                @apply text-6xl text-slime font-bold mt-20 mb-10;
            }

            li {
                @apply m-auto list-decimal text-2xl font-bold text-slime;
            }

            body {
                @apply w-2/3 m-auto bg-charcoal;
            }

            fieldset {
                @apply border-4 border-pumpkin p-2 flex flex-row gap-30;
            }

            label {
                @apply font-bold border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-7 mr-10;
            }

            input {
                @apply font-bold border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-10;
            }

            select {
                @apply border-pumpkin border-2 text-pumpkin bg-slime hover:bg-pumpkin hover:text-slime flex-auto mr-18;
            }

            img {
                @apply h-60 border-2;
            }

            p {
                @apply text-pumpkin font-bold;
            }
            
            
        }

    </style>

</head>


<body>
    <h1>Lista de compras</h1>
    <br>
    <fieldset>
        <label for="mes">Agregar un producto</label>
        <input type="text" id="prod" placeholder="Nombre del producto">
        <input class="flex-1" type="button" value="Agregar" onclick="agregar()">
    </fieldset>
    <br>
    <fieldset>
        <label for="mes">Eliminar un producto</label>
        <input type="text" id="elim" placeholder="Escribe la posición del producto para eliminar">
        <input class="flex-1" type="button" value="Eliminar" onclick="eliminar()">
    </fieldset>
   
    <input class="block mt-5 mb-10 mx-auto" type="button" value="Vaciar el carro" onclick="vaciar()">

    <fieldset class="h-100">
        <p id="carro" class="flex-1">El carro está vacio</p>
        <div>
            <img src="./shopping-cart.svg" alt="" class="align">
            <p class="text-center"><span id="nPr" class="text-slime">0</span> productos en el carrito</p>
        </div>
    </fieldset>
    <br>
    <br>
    <p id="contenido"></p>

    <script>
        const productos = [];
        const PROD = document.getElementById("prod");
        const CARRO = document.getElementById("carro");
        const ELI = document.getElementById("elim");
        const NPR = document.getElementById("nPr");

        function agregar() {
            let prod = PROD.value;
            productos.push(prod);
            let productosStr = productos.join("<br><br>");
            CARRO.innerHTML = productosStr;
            NPR.innerHTML = `${productos.length}`
        }

        function eliminar() {
            let elimin = parseInt(ELI.value) -1;
            productos.splice(elimin, 1);
            let productosStr = productos.join("<br><br>");
            CARRO.innerHTML = productosStr;
            NPR.innerHTML = `${productos.length}`
        }

        function vaciar() {
            productos.splice(0, productos.length);
            let productosStr = productos.join("<br><br>");
            CARRO.innerHTML = productosStr;
            NPR.innerHTML = `${productos.length}`
        }

    </script>

</body>

</html>
