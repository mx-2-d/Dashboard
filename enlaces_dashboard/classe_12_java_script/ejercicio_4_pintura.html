<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintura</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {

        }

        @layer base {
            h1 {
                @apply text-2xl;
            }

            body {
                @apply mx-40 my-4 bg-gray-300;
            }

            /* Default es flex-nowrap */
            fieldset {
                @apply flex flex-row flex-wrap gap-4;
            }

            label {
                @apply flex-1 shrink min-h-6 max-w-80;
            }

            input {
                @apply flex-2 shrink min-h-6 max-w-150 border-black border-2 bg-lime-400 hover:bg-purple-400 hover:text-lg text-red-600;
            }

            
            
        }

    </style>

</head>


<body>
    <h1>Pintura necesaria para pintar un área rectangular</h1>
    <br>
    <form action="">
        <fieldset>
            <label for="alto">Alto de la pared en metros</label>
            <input type="number" id="alto" name="alto">
        </fieldset>
        <br>
        <fieldset>
            <label for="ancho">Ancho de la pared en metros</label>
            <input type="number" id="ancho" name="ancho">  
        </fieldset>
        <br>
        <fieldset>
            <label for="manos">Manos de pintura para aplicar</label>
            <input type="number" id="manos" name="manos">  
        </fieldset>

    </form>
    <br>
    <br>
    <input type="button" value="Promedio" onclick="pintura_l()">
    <br>
    <br>
    <p id="resultados"></p>

    <script>
        const alto = document.getElementById("alto");
        const ancho = document.getElementById("ancho");
        const manos = document.getElementById("manos");
        const resultados = document.getElementById("resultados")

        function pintura_l() {
            let area_m2 = parseFloat(alto.value) * parseFloat(ancho.value);
            let litros_area = area_m2 / 12;
            let litros_total = litros_area * parseFloat(manos.value);

            let dos = "2";
            let sup2 = dos.sup();
            resultados.innerHTML = `Hace falta ${litros_total} litros de pintura para pintar el area de ${area_m2} m${sup2} con un número de ${manos.value} manos.`;
        }


    </script>

</body>

</html>


<!-- 
inputs son etiquetas de controles, no tienen etiqueta de cierre y entonces no tienen innerHTML

Se mapea primero los constantes para buscar los elementos y después se hace operaciones en ellos. Es por si el mismo elemento quieres hacer diferentes operaciones después.
-->
