
<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
   </script>

   <style type="text/tailwindcss">
      @import "tailwindcss"; 
 
     @theme {
       --font-sans: ui-sans-serif, system-ui, sans-serif;
       --color-brand: #ff4500;
     }
 
     @layer base {
       p {@apply mb-2 leading-relaxed text-gray-700;}       
       input {@apply rounded-sm border-1 border-gray-500 text-pink-800 font-serif}
       input, label {@apply inline-block flex-1 pl-4}

   </style>
   <title>TEST DIVERTIDO</title>
</head>

<body class="container mx-auto w-4/5"> <!-- 80% ancho -->

      </p>
      <p class="flex flex-row">

   <p class="mt-4">
      <button class="bg-pink-800 text-white font-bold" type="button" onclick="cambiar()">

   <script>
    const p1 = document.getElementById("p1");

    const caballo = document.getElementById("caballo");
    const mono = document.getElementById("mono");

    const rojo = document.getElementById("rojo");
