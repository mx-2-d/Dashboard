<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio Notas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <style type="text/tailwindcss">
        @import "tailwindcss";

        @theme {

        }

        @layer base {
            h1 {
                @apply text-2xl;
            }

            body {
                @apply w-4/5 m-auto bg-gray-300;
            }

            fieldset {
                @apply flex flex-row;
            }

            label {
                @apply flex-1 h-6;
            }

            input {
                @apply flex-2 h-6 border-black border-2 bg-lime-400 hover:bg-purple-400 text-red-600;
            }

            
            
        }

    </style>

</head>


<body>
    <br>
    <h1>Promedio de tres notas</h1>
    <br>
    <form action="">
        <fieldset>
            <label for="n1">Escribe la primera nota</label>
            <input type="number" id="n1" name="n1">
        </fieldset>
        <br>
        <fieldset>
            <label for="n2">Escribe la segunda nota</label>
            <input type="number" id="n2" name="n2">  
        </fieldset>
        <br>
        <fieldset>
            <label for="n3">Escribe la tercera nota</label>
            <input type="number" id="n3" name="n3">  
        </fieldset>

    </form>
    <br>
    <br>
    <input type="button" value="Promedio" onclick="promedio()">
    <br>
    <br>
    <p id="resultados"></p>

    <script>
        const n1 = document.getElementById("n1");
        const n2 = document.getElementById("n2");
        const n3 = document.getElementById("n3");
        const resultados = document.getElementById("resultados")

        function promedio() {
            let promed = (parseFloat(n1.value) + parseFloat(n2.value) + parseFloat(n3.value)) / 3;

            resultados.innerHTML = `El promedio de las notas es ${promed}.`;
        }


    </script>

</body>

</html>


<!-- 
inputs son etiquetas de controles, no tienen etiqueta de cierre y entonces no tienen innerHTML

Se mapea primero los constantes para buscar los elementos y después se hace operaciones en ellos. Es por si el mismo elemento quieres hacer diferentes operaciones después.
-->
